# Supabase project configuration
# Deploy functions with: supabase functions deploy

[api]
enabled = true

[functions.push-notify]
verify_jwt = false

[functions.get-insights]
verify_jwt = false

[functions.ai-chat]
verify_jwt = false

[functions.plaid-link-token]
verify_jwt = false

[functions.plaid-exchange-token]
verify_jwt = false

[functions.plaid-sync-transactions]
verify_jwt = false

[functions.plaid-refresh-balance]
verify_jwt = false

# Deployed verify_jwt=false (auth is internal via getUser(token), see file
# header) but had no config entry until 2026-09-07 — same undeclared-drift
# class as large-transaction-alert / plaid-batch-sync / weekly-report above.
[functions.plaid-get-accounts]
verify_jwt = false

[functions.generate-monthly-report]
verify_jwt = false

[functions.market-data]
verify_jwt = false

[functions.stock-ai-analysis]
verify_jwt = false

# Cron / service-role functions — each does its own service-role-key or JWT
# check inside the function body, so the platform gateway check must be off.
# These three were deployed verify_jwt=false but had no config entry until
# 2026-09-07 — undeclared drift, the same class as the financial-diagnosis
# note below. A plain `supabase functions deploy <name>` without this would
# flip the gateway to true and silently kill the cron (the 2026-07-25
# incident: weekly-report / plaid-batch-sync went dark).
[functions.large-transaction-alert]
verify_jwt = false

[functions.plaid-batch-sync]
verify_jwt = false

[functions.weekly-report]
verify_jwt = false

# Explicit, not left to default — matches the house convention every other
# client-facing function here uses (manual JWT check inside the function,
# not the platform gateway check). Without this entry it silently inherited
# Supabase's own default (true), which happened to still work (verified live
# via a real OPTIONS preflight + the auth smoke test) but was undeclared
# config drift from day one, the exact class of gap E1 already fixed once
# for check-bank-connection/delete-account (security-auditor finding,
# 2026-08-23).
[functions.financial-diagnosis]
verify_jwt = false

[functions.daily-lesson-v2]
verify_jwt = false

[functions.alpaca-invest]
verify_jwt = false

[functions.stripe-checkout]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.auth-login]
verify_jwt = false

[functions.auth-signup]
verify_jwt = false

[functions.alpaca-oauth-callback]
verify_jwt = false

[functions.alpaca-oauth-start]
verify_jwt = false

[functions.alpaca-portfolio]
verify_jwt = false

[functions.check-bank-connection]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
