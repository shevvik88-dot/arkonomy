name: Gitleaks

# The only layer in this repo's secret-scanning setup that can't be silently
# skipped: .githooks/pre-commit degrades to a no-op if gitleaks isn't
# installed locally, and .claude/hooks/pre-commit-security-review.cjs only
# sees commits made through Claude Code's own Bash tool. This one hard-fails
# CI regardless of how the commit was made.
#
# push/pull_request jobs scan only the new commits/diff (gitleaks-action's
# default behavior, fast). The daily schedule (+ manual workflow_dispatch)
# does a full commit-history scan, so every commit still gets re-verified
# even if it slipped through an earlier incremental scan.
#
# gitleaks-action is free for personal GitHub accounts (this repo), no
# GITLEAKS_LICENSE needed. Would be required if this ever moves to an org.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * *" # daily full-history scan
  workflow_dispatch: {} # manual full-history scan

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # gitleaks-action comments on the PR if leaks are found
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, required for gitleaks-action to work correctly

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
